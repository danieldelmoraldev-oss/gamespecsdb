# Daily content update: new games, eShop data refresh, coming soon -> released.
# Every Monday it refreshes every game (and upgrade prices). Pushing to main makes
# Cloudflare Pages rebuild and publish the site.
name: Auto update

on:
  schedule:
    - cron: '17 6 * * *' # every day at 06:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: Refresh every game, not only new and upcoming ones
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Update game data
        id: update
        run: python3 scripts/auto_update.py ${{ inputs.full && '--full' || '' }}

      # Never publish data that breaks the site.
      - name: Build check
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name "gamespecsdb-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data src/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "${{ steps.update.outputs.summary }}"
            git push
          fi
